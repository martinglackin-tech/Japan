        function initAudioContext() {
            try {
                if (!audioContext && (window.AudioContext || window.webkitAudioContext)) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioContext && audioContext.state === 'suspended') {
                    audioContext.resume();
                }
            } catch (e) {
                console.warn("AudioContext init handled:", e);
            }
        }

        function playChime() {
            try {
                initAudioContext();
                if (!audioContext) return;
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioContext.currentTime); // D5
                osc.frequency.exponentialRampToValueAtTime(880, audioContext.currentTime + 0.12); // A5
                gain.gain.setValueAtTime(0.08, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.start();
                osc.stop(audioContext.currentTime + 0.2);
            } catch (e) {
                // Non-critical audio chime
            }
        }

        // --- STUDIO-GRADE GEMINI TTS HELPERS ---
        function base64ToArrayBuffer(base64) {
            const binaryString = window.atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        function pcmToWav(pcm16, sampleRate = 24000, numChannels = 1) {
            const buffer = new ArrayBuffer(44 + pcm16.length * 2);
            const view = new DataView(buffer);

            // RIFF chunk descriptor
            writeAsciiString(view, 0, 'RIFF');
            view.setUint32(4, 36 + pcm16.length * 2, true);
            writeAsciiString(view, 8, 'WAVE');

            // "fmt " sub-chunk
            writeAsciiString(view, 12, 'fmt ');
            view.setUint32(16, 16, true); // Subchunk1Size (16 for PCM)
            view.setUint16(20, 1, true);  // AudioFormat (1 for PCM)
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * numChannels * 2, true); // ByteRate
            view.setUint16(32, numChannels * 2, true);             // BlockAlign
            view.setUint16(34, 16, true);                          // BitsPerSample

            // "data" sub-chunk
            writeAsciiString(view, 36, 'data');
            view.setUint32(40, pcm16.length * 2, true);

            // PCM samples
            let offset = 44;
            for (let i = 0; i < pcm16.length; i++, offset += 2) {
                view.setInt16(offset, pcm16[i], true);
            }

            return new Blob([view], { type: 'audio/wav' });
        }

        function writeAsciiString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        async function fetchStudioJapaneseAudio(text) {
            const cacheKey = `${text}_${speechRate}`;
            if (studioAudioCache.has(cacheKey)) {
                return studioAudioCache.get(cacheKey);
            }

            const apiKey = "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{
                    parts: [{
                        text: `Speak clearly and at a gentle, comfortable, easy-to-follow pace with pleasant natural Japanese pronunciation: ${text}`
                    }]
                }],
                generationConfig: {
                    responseModalities: ["AUDIO"],
                    speechConfig: {
                        voiceConfig: {
                            prebuiltVoiceConfig: { voiceName: "Aoede" }
                        }
                    }
                },
                model: "gemini-2.5-flash-preview-tts"
            };

            // Exponential backoff fetch
            let delay = 1000;
            for (let attempt = 0; attempt < 3; attempt++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        const result = await response.json();
                        const part = result?.candidates?.[0]?.content?.parts?.[0];
                        const audioData = part?.inlineData?.data;
                        const mimeType = part?.inlineData?.mimeType || "audio/L16;rate=24000";

                        if (audioData) {
                            const rateMatch = mimeType.match(/rate=(\d+)/);
                            const sampleRate = rateMatch ? parseInt(rateMatch[1], 10) : 24000;
                            const pcmBuffer = base64ToArrayBuffer(audioData);
                            const pcm16 = new Int16Array(pcmBuffer);
                            const wavBlob = pcmToWav(pcm16, sampleRate, 1);
                            const audioUrl = URL.createObjectURL(wavBlob);
                            studioAudioCache.set(cacheKey, audioUrl);
                            return audioUrl;
                        }
                    }
                } catch (e) {
                    // Backoff retry without breaking console
                }
                await new Promise(r => setTimeout(r, delay));
                delay *= 2;
            }
            return null;
        }

        function populateVoices() {
            if ('speechSynthesis' in window) {
                try {
                    cachedVoices = window.speechSynthesis.getVoices();
                } catch (e) {

                }
            }
        }

        function getBestJapaneseVoice() {
            if (!cachedVoices || cachedVoices.length === 0) {
                populateVoices();
            }
            let match = cachedVoices.find(v => v.lang === 'ja-JP' || v.lang === 'ja_JP');
            if (match) return match;
            match = cachedVoices.find(v => v.lang && v.lang.toLowerCase().startsWith('ja'));
            if (match) return match;
            match = cachedVoices.find(v => v.name && (v.name.toLowerCase().includes('japan') || v.name.includes('日本語')));
            return match || null;
        }

        function playFallbackSpeechSynthesis(cleanText, triggerBtn) {
            if (!('speechSynthesis' in window)) {

                    const utterance = new SpeechSynthesisUtterance(cleanText);
                    utterance.lang = 'ja-JP';
                    utterance.rate = speechRate;
                    utterance.pitch = 1.0;

                    const voice = getBestJapaneseVoice();
                    if (voice) utterance.voice = voice;

                    activeUtterances.add(utterance);

                    const cleanup = () => {
                        activeUtterances.delete(utterance);
                        if (triggerBtn) {
                            triggerBtn.classList.remove('speaking-pulse', 'text-orange-600', 'bg-orange-100');
                        }
                    };

                    utterance.onend = cleanup;
                    utterance.onerror = cleanup;
                    setTimeout(cleanup, 4500);

                    window.speechSynthesis.speak(utterance);
                    window.speechSynthesis.resume();
                }, 20);
            } catch (err) {
                if (triggerBtn) triggerBtn.classList.remove('speaking-pulse');
            }
        }

        function sanitizeJapaneseText(text) {
            return text
                .replace(/[\/\／]/g, '、')
                .replace(/[\(\)（）]/g, '')
                .replace(/[!！?？]/g, '。')
                .trim();
        }

        async function playAudio(text, event, triggerBtn) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }

            initAudioContext();

            if (triggerBtn) {
                triggerBtn.classList.add('speaking-pulse', 'text-orange-600', 'bg-orange-100');
            }

            // Stop any currently playing audio track
            if (currentPlayingAudio) {
                try {
                    currentPlayingAudio.pause();
                    currentPlayingAudio.currentTime = 0;
                } catch (e) {}
            }

            const cleanText = sanitizeJapaneseText(text);
            showToast(`Speaking: ${cleanText}`);

            try {
                // Attempt high-definition native studio audio via Gemini TTS
                const audioUrl = await fetchStudioJapaneseAudio(cleanText);

                if (audioUrl) {
                    const audio = new Audio(audioUrl);
                    currentPlayingAudio = audio;
                    audio.playbackRate = speechRate;

                    const cleanup = () => {
                        if (triggerBtn) {
                            triggerBtn.classList.remove('speaking-pulse', 'text-orange-600', 'bg-orange-100');
                        }
                    };

                    audio.onended = cleanup;
                    audio.onerror = () => {
                        cleanup();
                        playFallbackSpeechSynthesis(cleanText, triggerBtn);
                    };

                    await audio.play();
                    return;
                }
            } catch (err) {
                // Seamlessly fallback to browser synthesis if offline
            }

            // Fallback to local synthesis if studio stream isn't available
            playFallbackSpeechSynthesis(cleanText, triggerBtn);
        }

        function setActiveNav(button) {
            [navLearn, navFlashcards, navQuiz].forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
        }

        function showLearnView() {
            setActiveNav(navLearn);

            // Category filter pills
            const filterButtons = `
                <div class="flex items-center space-x-2 overflow-x-auto pb-2 mb-5 no-scrollbar">
                    <button class="cat-filter-btn px-4 py-2 rounded-full text-xs md:text-sm font-bold transition-all shadow-sm whitespace-nowrap ${selectedCategoryFilter === 'all' ? 'bg-orange-600 text-white shadow-orange-300' : 'bg-white/90 text-gray-700 hover:bg-orange-50'}" data-category="all">
                        ✨ All (${phrases.length})
                    </button>
                    <button class="cat-filter-btn px-4 py-2 rounded-full text-xs md:text-sm font-bold transition-all shadow-sm whitespace-nowrap ${selectedCategoryFilter === 'greetings' ? 'bg-orange-600 text-white shadow-orange-300' : 'bg-white/90 text-gray-700 hover:bg-orange-50'}" data-category="greetings">
                        🎌 Greetings
                    </button>
                    <button class="cat-filter-btn px-4 py-2 rounded-full text-xs md:text-sm font-bold transition-all shadow-sm whitespace-nowrap ${selectedCategoryFilter === 'dining' ? 'bg-orange-600 text-white shadow-orange-300' : 'bg-white/90 text-gray-700 hover:bg-orange-50'}" data-category="dining">
                        🍱 Dining &amp; Coeliac
                    </button>
                    <button class="cat-filter-btn px-4 py-2 rounded-full text-xs md:text-sm font-bold transition-all shadow-sm whitespace-nowrap ${selectedCategoryFilter === 'about' ? 'bg-orange-600 text-white shadow-orange-300' : 'bg-white/90 text-gray-700 hover:bg-orange-50'}" data-category="about">
                        👥 About Us
                    </button>
                    <button class="cat-filter-btn px-4 py-2 rounded-full text-xs md:text-sm font-bold transition-all shadow-sm whitespace-nowrap ${selectedCategoryFilter === 'travel' ? 'bg-orange-600 text-white shadow-orange-300' : 'bg-white/90 text-gray-700 hover:bg-orange-50'}" data-category="travel">
                        🚆 Travel &amp; Pay
                    </button>
                </div>
            `;

            let content = `
                <div class="mb-3 flex items-center justify-between px-1">
                    <p class="text-xs md:text-sm font-semibold text-gray-700">Tap 🔊 to hear spoken pronunciation</p>
                    <span class="text-xs bg-teal-100 text-teal-800 font-bold px-3 py-1 rounded-full">25 Essential Phrases</span>
                </div>
                ${filterButtons}
            `;

            const sectionOrder = ["greetings", "dining", "about", "travel"];
            const sectionsToRender = selectedCategoryFilter === "all" 
                ? sectionOrder 
                : [selectedCategoryFilter];

            sectionsToRender.forEach(catKey => {
                const cat = categories[catKey];
                const catPhrases = phrases.filter(p => p.category === catKey);
                if (catPhrases.length === 0) return;

                content += `
                    <section class="mb-7">
                        <div class="flex items-center justify-between mb-3 px-2 border-b border-teal-200/60 pb-2">
                            <div class="flex items-center space-x-2">
                                <span class="text-2xl">${cat.icon}</span>
                                <div>
                                    <h3 class="font-bold text-gray-900 text-lg md:text-xl">${cat.name}</h3>
                                    <p class="text-xs font-semibold text-teal-800/80 jp-font">${cat.jp}</p>
                                </div>
                            </div>
                            <span class="text-xs bg-white/90 text-gray-600 font-semibold px-2.5 py-1 rounded-full shadow-sm">
                                ${catPhrases.length} phrases
                            </span>
                        </div>
                        <div class="space-y-3">
                `;

                catPhrases.forEach(phrase => {
                    content += `
                        <div class="bg-white/95 backdrop-blur-sm p-4 md:p-5 rounded-2xl shadow-sm hover:shadow-md flex items-center justify-between transition-all duration-200 border border-white/80">
                            <div class="pr-2 flex-grow">
                                <div class="flex flex-wrap items-center gap-2">
                                    <p class="font-bold text-base md:text-lg text-gray-800">${phrase.english}</p>
                                </div>
                                <p class="text-orange-600 font-semibold text-sm md:text-base mt-0.5">${phrase.romaji}</p>
                                <div class="flex items-center mt-2">
                                    <p class="jp-font text-gray-900 text-xl md:text-2xl font-bold tracking-wide">${phrase.japanese}</p>
                                </div>
                            </div>
                            <button type="button" class="play-audio-btn p-3 rounded-full bg-orange-50 hover:bg-orange-100 text-orange-600 shadow-sm flex-shrink-0 border border-orange-100" data-text="${phrase.japanese}" aria-label="Listen to pronunciation">
                                ${speakerIconSVG}
                            </button>
                        </div>
                    `;
                });

                content += `
                        </div>
                    </section>
                `;
            });

            mainContent.innerHTML = content;

            // Bind audio buttons
            mainContent.querySelectorAll('.play-audio-btn').forEach(button => {
                button.addEventListener('click', (e) => {
                    playAudio(button.dataset.text, e, button);
                });
            });

            // Bind category filter tabs
            mainContent.querySelectorAll('.cat-filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    selectedCategoryFilter = e.currentTarget.dataset.category;
                    showLearnView();
                });
            });
        }

        function showFlashcardsView() {
            setActiveNav(navFlashcards);
            flashcardItems = [...phrases, ...words];
            // Fisher-Yates shuffle
            for (let i = flashcardItems.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [flashcardItems[i], flashcardItems[j]] = [flashcardItems[j], flashcardItems[i]];
            }
            currentFlashcardIndex = 0;
            renderFlashcard();
        }

        function renderFlashcard() {
            if (flashcardItems.length === 0) {
                mainContent.innerHTML = `<p class="text-center text-gray-600 p-8">No flashcards available.</p>`;
                return;
            }
            const item = flashcardItems[currentFlashcardIndex];
            const catInfo = categories[item.category] || { name: "Vocabulary", icon: "📖" };

            mainContent.innerHTML = `
                <div class="text-center mb-3">
                    <p class="text-xs md:text-sm text-gray-600 font-semibold">Tap card to flip • Tap 🔊 for audio pronunciation</p>
                </div>
                <div class="perspective-1000 h-80 max-w-xl mx-auto">
                    <div id="flashcard" class="card relative w-full h-full mx-auto cursor-pointer">
                        <!-- Front Face -->
                        <div class="card-face absolute w-full h-full bg-white rounded-3xl shadow-xl flex flex-col items-center justify-center p-8 text-center border border-teal-50">
                            <span class="text-xs uppercase font-extrabold tracking-widest text-teal-800 bg-teal-50 px-3.5 py-1.5 rounded-full mb-3 flex items-center space-x-1 border border-teal-100">
                                <span>${catInfo.icon}</span>
                                <span>${catInfo.name}</span>
                            </span>
                            <h2 class="text-2xl md:text-3xl font-extrabold text-gray-800 leading-snug">${item.english}</h2>
                            <span class="text-xs text-orange-500 font-bold mt-6 tracking-wide">Tap to reveal Japanese &rarr;</span>
                        </div>
                        <!-- Back Face -->
                        <div class="card-back card-face absolute w-full h-full bg-gradient-to-br from-orange-500 via-rose-500 to-orange-600 text-white rounded-3xl shadow-xl flex flex-col items-center justify-center p-8 text-center">
                            <span class="text-xs uppercase font-bold tracking-widest text-orange-100 bg-black/20 px-3 py-1 rounded-full mb-2">Japanese</span>
                            <p class="text-xl md:text-2xl font-bold tracking-wide text-orange-100 mb-2">${item.romaji}</p>
                            <p class="jp-font text-3xl md:text-4xl font-black mb-4">${item.japanese}</p>
                            <button type="button" class="play-audio-btn p-3.5 bg-white text-orange-600 hover:text-orange-700 rounded-full shadow-lg" data-text="${item.japanese}" aria-label="Pronounce">
                                ${speakerIconSVG}
                            </button>
                        </div>
                    </div>
                </div>
                <div class="flex justify-between items-center max-w-xl mx-auto mt-6 px-2">
                    <button id="prev-card" class="btn-nav bg-white text-gray-700 font-bold py-3 px-6 rounded-full flex items-center space-x-1">
                        <span>&larr;</span><span>Prev</span>
                    </button>
                    <span class="font-bold text-gray-700 bg-white/90 px-4 py-1.5 rounded-full shadow-sm text-sm md:text-base border border-gray-100">
                        ${currentFlashcardIndex + 1} / ${flashcardItems.length}
                    </span>
                    <button id="next-card" class="btn-nav bg-white text-gray-700 font-bold py-3 px-6 rounded-full flex items-center space-x-1">
                        <span>Next</span><span>&rarr;</span>
                    </button>
                </div>
            `;

            const flashcard = mainContent.querySelector('#flashcard');
            flashcard.addEventListener('click', (e) => {
                if (!e.target.closest('.play-audio-btn')) {
                    flashcard.classList.toggle('is-flipped');
                }
            });

            const audioBtn = mainContent.querySelector('.play-audio-btn');
            if (audioBtn) {
                audioBtn.addEventListener('click', (e) => {
                    playAudio(audioBtn.dataset.text, e, audioBtn);
                });
            }

            mainContent.querySelector('#prev-card').addEventListener('click', () => {
                currentFlashcardIndex = (currentFlashcardIndex - 1 + flashcardItems.length) % flashcardItems.length;
                renderFlashcard();
            });

            mainContent.querySelector('#next-card').addEventListener('click', () => {
                currentFlashcardIndex = (currentFlashcardIndex + 1) % flashcardItems.length;
                renderFlashcard();
            });

            // Touch Swipe Handler
            let touchStartX = 0;
            let touchEndX = 0;
            flashcard.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            flashcard.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                const swipeDist = touchEndX - touchStartX;
                if (swipeDist > 55) {
                    currentFlashcardIndex = (currentFlashcardIndex - 1 + flashcardItems.length) % flashcardItems.length;
                    renderFlashcard();
                } else if (swipeDist < -55) {
                    currentFlashcardIndex = (currentFlashcardIndex + 1) % flashcardItems.length;
                    renderFlashcard();
                }
            }, { passive: true });
        }

        function showQuizView() {
            setActiveNav(navQuiz);
            startQuiz();
        }

        function startQuiz() {
            quizScore = 0;
            currentQuizQuestionIndex = 0;
            quizResults = [];
            quizQuestions = generateQuizQuestions();
            renderQuizQuestion();
        }

        function generateQuizQuestions() {
            const shuffled = [...phrases].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, 10).map(correctPhrase => {
                const wrongPool = phrases
                    .filter(p => p.id !== correctPhrase.id)
                    .sort(() => 0.5 - Math.random())
                    .slice(0, 3);
                
                const options = [correctPhrase, ...wrongPool].sort(() => 0.5 - Math.random());
                return {
                    question: correctPhrase.english,
                    options: options.map(p => ({ romaji: p.romaji, japanese: p.japanese })),
                    answer: correctPhrase.romaji
                };
            });
        }

        function renderQuizQuestion() {
            if (currentQuizQuestionIndex >= quizQuestions.length) {
                showQuizResults();
                return;
            }
            const q = quizQuestions[currentQuizQuestionIndex];
            mainContent.innerHTML = `
                <div class="bg-white/95 backdrop-blur-sm p-6 md:p-8 rounded-3xl shadow-xl text-center flex flex-col justify-center min-h-[22rem] max-w-2xl mx-auto border border-orange-100">
                    <div class="flex items-center justify-between mb-4">
                        <span class="text-xs font-bold text-gray-500 uppercase tracking-widest">Question ${currentQuizQuestionIndex + 1} of ${quizQuestions.length}</span>
                        <span class="text-xs font-bold bg-orange-100 text-orange-700 px-3 py-1 rounded-full">Score: ${quizScore}</span>
                    </div>
                    <h2 class="text-2xl md:text-3xl font-extrabold mb-6 text-gray-900">${q.question}</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                        ${q.options.map(option => `
                            <div class="quiz-option-container flex items-center bg-gray-50 border-2 border-gray-200/80 rounded-2xl shadow-sm hover:border-orange-400 hover:bg-orange-50/50 transition-all duration-200 cursor-pointer overflow-hidden" data-answer="${option.romaji}">
                                <span class="flex-grow p-4 text-base md:text-lg text-orange-700 font-bold text-center">${option.romaji}</span>
                                <button type="button" class="play-audio-btn p-4 text-gray-400 hover:text-orange-600 flex-shrink-0" data-text="${option.japanese}" aria-label="Listen">
                                    ${speakerIconSVG}
                                </button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            mainContent.querySelectorAll('.quiz-option-container').forEach(container => {
                container.addEventListener('click', handleQuizAnswer);
            });
        }

        function handleQuizAnswer(e) {
            const container = e.target.closest('.quiz-option-container');
            if (!container) return;

            if (e.target.closest('.play-audio-btn')) {
                const audioBtn = e.target.closest('.play-audio-btn');
                playAudio(audioBtn.dataset.text, e, audioBtn);
                return;
            }

            mainContent.querySelectorAll('.quiz-option-container').forEach(c => c.style.pointerEvents = 'none');

            const selectedAnswer = container.dataset.answer;
            const correctAnswer = quizQuestions[currentQuizQuestionIndex].answer;
            const isCorrect = selectedAnswer === correctAnswer;

            quizResults.push({
                question: quizQuestions[currentQuizQuestionIndex].question,
                selectedAnswer: selectedAnswer,
                correctAnswer: correctAnswer,
                isCorrect: isCorrect
            });

            if (isCorrect) {
                quizScore++;
                container.classList.remove('bg-gray-50', 'border-gray-200/80');
                container.classList.add('bg-emerald-500', 'border-emerald-600', 'text-white');
                const span = container.querySelector('span');
                if (span) span.classList.add('text-white');
            } else {
                container.classList.remove('bg-gray-50', 'border-gray-200/80');
                container.classList.add('bg-rose-500', 'border-rose-600', 'text-white');
                const span = container.querySelector('span');
                if (span) span.classList.add('text-white');
            }

            setTimeout(() => {
                currentQuizQuestionIndex++;
                renderQuizQuestion();
            }, 900);
        }

        function showQuizResults() {
            const scorePercentage = Math.round((quizScore / quizQuestions.length) * 100);
            document.getElementById('modal-score').textContent = `${scorePercentage}%`;

            let feedback = "Good effort! Keep practicing Josey & Frankie's phrases.";
            if (scorePercentage === 100) feedback = "Sugoi! 🌟 Perfect score! You're ready for Japan!";
            else if (scorePercentage >= 80) feedback = "Brilliant job! You've got the essentials locked down.";
            else if (scorePercentage >= 60) feedback = "Great work! Review your flashcards and try again.";
            
            document.getElementById('modal-feedback').textContent = feedback;
            showQuizModal();
        }

        function showAnswersBreakdown() {
            let breakdownHTML = '<ul class="space-y-2.5">';
            quizResults.forEach(result => {
                if (result.isCorrect) {
                    breakdownHTML += `
                        <li class="p-2.5 rounded-xl bg-emerald-50 border-l-4 border-emerald-500">
                            <p class="font-bold text-gray-800">${result.question}</p>
                            <p class="text-emerald-700 font-semibold">✓ ${result.selectedAnswer}</p>
                        </li>
                    `;
                } else {
                    breakdownHTML += `
                        <li class="p-2.5 rounded-xl bg-rose-50 border-l-4 border-rose-500">
                            <p class="font-bold text-gray-800">${result.question}</p>
                            <p class="text-rose-600 font-semibold line-through">✗ ${result.selectedAnswer}</p>
                            <p class="text-emerald-700 font-semibold">✓ Correct: ${result.correctAnswer}</p>
                        </li>
                    `;
                }
            });
            breakdownHTML += '</ul>';
            answersBreakdown.innerHTML = breakdownHTML;
            answersBreakdown.classList.remove('hidden');
            seeAnswersBtn.classList.add('hidden');
        }

        function showQuizModal() {
            quizModal.classList.remove('hidden');
            setTimeout(() => {
                quizModal.classList.remove('opacity-0');
                modalContainer.classList.remove('scale-95', 'opacity-0');
                modalContainer.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function hideQuizModal() {
            modalContainer.classList.remove('scale-100', 'opacity-100');
            modalContainer.classList.add('scale-95', 'opacity-0');
            quizModal.classList.add('opacity-0');
            setTimeout(() => {
                quizModal.classList.add('hidden');
                answersBreakdown.classList.add('hidden');
                seeAnswersBtn.classList.remove('hidden');
            }, 250);
        }

        navLearn.addEventListener('click', showLearnView);
        navFlashcards.addEventListener('click', showFlashcardsView);
        navQuiz.addEventListener('click', showQuizView);

        modalCloseBtn.addEventListener('click', () => {
            hideQuizModal();
            startQuiz();
        });

        seeAnswersBtn.addEventListener('click', (e) => {
            e.preventDefault();
            showAnswersBreakdown();
        });

        function updateSpeedButtonStates(activeBtn) {
            [speedComfortableBtn, speedNormalBtn, speedSlowBtn].forEach(btn => {
                if (btn === activeBtn) {
                    btn.classList.remove('bg-gray-200', 'text-gray-700', 'hover:bg-gray-300');
                    btn.classList.add('bg-orange-500', 'text-white');
                } else {
                    btn.classList.remove('bg-orange-500', 'text-white');
                    btn.classList.add('bg-gray-200', 'text-gray-700', 'hover:bg-gray-300');
                }
            });
        }

        // Speed Toggle Listeners
        speedComfortableBtn.addEventListener('click', () => {
            speechRate = 0.85; // Slightly slower, comfortable cadence
            updateSpeedButtonStates(speedComfortableBtn);
            showToast("Audio speed: 0.85x (Comfortable pace)");
        });

        speedNormalBtn.addEventListener('click', () => {
            speechRate = 1.0; // Standard native speed
            updateSpeedButtonStates(speedNormalBtn);
            showToast("Audio speed: 1.0x (Standard speed)");
        });

        speedSlowBtn.addEventListener('click', () => {
            speechRate = 0.7; // Slower for careful study
            updateSpeedButtonStates(speedSlowBtn);
            showToast("Audio speed: 0.7x (Slow practice)");
        });

        // Audio Test Button
        testAudioBtn.addEventListener('click', (e) => {
            initAudioContext();
            playAudio("こんにちは。ありがとうございます！", e, testAudioBtn);
        });

        // App Initialization
        document.addEventListener('DOMContentLoaded', () => {
            populateVoices();
            if ('speechSynthesis' in window && window.speechSynthesis.onvoiceschanged !== undefined) {
                window.speechSynthesis.onvoiceschanged = populateVoices;
            }
            showLearnView();
        });
    </script>
</body>
</html>
